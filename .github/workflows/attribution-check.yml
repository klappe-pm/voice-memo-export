# Attribution check for pull requests and pushes (A-02 of
# docs/adr/2026-09-23-make-attribution-enforcement-travel-with-the-repository.md
# in llm-root). Source: scripts/ci/attribution-check.yml in llm-root, rendered
# into each managed project by scripts/sync-projects.py; edit the source.
#
# Comments are checked by attribution-check-comment.yml, a separate workflow
# with its own check name. A job skipped by an if: still reports its check,
# and a skipped check satisfies a required one, so no comment event may ever
# run this workflow. An old comment cannot be edited away, so it never blocks.
name: attribution-check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  pull-request:
    name: attribution-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: scan what the event published
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/commits" --paginate --jq '.[] | {sha: .sha, message: .commit.message}' > "$RUNNER_TEMP/commits.jsonl"
            python3 .github/attribution-check/attribution-check.py --commits "$RUNNER_TEMP/commits.jsonl"
          else
            python3 .github/attribution-check/attribution-check.py
          fi
