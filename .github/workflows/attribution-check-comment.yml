# Attribution check for issue and review comments (A-02 of
# docs/adr/2026-09-23-make-attribution-enforcement-travel-with-the-repository.md
# in llm-root). Source: scripts/ci/attribution-check-comment.yml in llm-root,
# rendered into each managed project by scripts/sync-projects.py; edit the
# source.
#
# A separate workflow with its own check name, so a comment hit fails only
# this run and never reports, skips or satisfies the pull request check in
# attribution-check.yml.
name: attribution-check-comment

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  comment:
    name: attribution-check-comment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: scan the comment
        run: python3 .github/attribution-check/attribution-check.py
